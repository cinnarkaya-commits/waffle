<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Webcam Pose Tracking</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0b0b0f;
    color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  p.sub { color: #999; font-size: 13px; margin: 0 0 16px; }
  #stage {
    position: relative;
    width: 100%;
    max-width: 720px;
    aspect-ratio: 4 / 3;
    background: #111;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 0 1px #222;
  }
  video, canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  video { transform: scaleX(-1); }
  canvas { transform: scaleX(-1); }
  #status {
    margin-top: 12px;
    font-size: 13px;
    color: #8ecbff;
    min-height: 18px;
  }
  #controls {
    margin-top: 10px;
    display: flex;
    gap: 8px;
  }
  button {
    background: #1c1c24;
    border: 1px solid #333;
    color: #eee;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { background: #26262f; }
  button:disabled { opacity: 0.4; cursor: default; }
  #fps {
    position: absolute;
    top: 8px;
    right: 10px;
    font-size: 11px;
    color: #6f6;
    background: rgba(0,0,0,0.5);
    padding: 2px 6px;
    border-radius: 4px;
  }
</style>
</head>
<body>
  <h1>Webcam Pose Tracking</h1>
  <p class="sub">33-point body skeleton, runs fully in-browser via MediaPipe</p>

  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="fps"></div>
  </div>

  <div id="controls">
    <button id="startBtn">Start Camera</button>
    <button id="stopBtn" disabled>Stop</button>
  </div>
  <div id="status">Click "Start Camera" and allow webcam access.</div>

<script type="module">
import { PoseLandmarker, FilesetResolver, DrawingUtils } from
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const fpsEl = document.getElementById("fps");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");

let poseLandmarker = null;
let stream = null;
let running = false;
let lastTime = performance.now();
let frameCount = 0;

async function initModel() {
  statusEl.textContent = "Loading pose model…";
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numPoses: 1
  });
  statusEl.textContent = "Model loaded.";
}

async function startCamera() {
  startBtn.disabled = true;
  try {
    if (!poseLandmarker) await initModel();

    stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 640, height: 480 },
      audio: false
    });
    video.srcObject = stream;

    await new Promise(resolve => {
      video.onloadedmetadata = () => resolve();
    });

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    running = true;
    stopBtn.disabled = false;
    statusEl.textContent = "Tracking…";
    predictLoop();
  } catch (err) {
    statusEl.textContent = "Error: " + err.message +
      " (camera permission may be blocked — check browser settings)";
    startBtn.disabled = false;
  }
}

function stopCamera() {
  running = false;
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  startBtn.disabled = false;
  stopBtn.disabled = true;
  statusEl.textContent = "Stopped.";
  fpsEl.textContent = "";
}

const drawingUtils = new DrawingUtils(ctx);

function predictLoop() {
  if (!running) return;

  const now = performance.now();
  const results = poseLandmarker.detectForVideo(video, now);

  ctx.save();
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (results.landmarks) {
    for (const landmarks of results.landmarks) {
      drawingUtils.drawConnectors(
        landmarks,
        PoseLandmarker.POSE_CONNECTIONS,
        { color: "#00e5ff", lineWidth: 3 }
      );
      drawingUtils.drawLandmarks(landmarks, {
        color: "#ff2d78",
        lineWidth: 1,
        radius: 4
      });
    }
  }
  ctx.restore();

  frameCount++;
  if (now - lastTime >= 1000) {
    fpsEl.textContent = frameCount + " fps";
    frameCount = 0;
    lastTime = now;
  }

  requestAnimationFrame(predictLoop);
}

startBtn.addEventListener("click", startCamera);
stopBtn.addEventListener("click", stopCamera);
</script>
</body>
</html>
